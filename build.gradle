// ===== Spotless 설정 (항상 활성화) =====
spotless {
	java {
		// Google Java Format 적용 - 일관된 들여쓰기, 괄호 배치
		googleJavaFormat('1.19.2')

		// Import 정리 - 표준 순서로 자동 정렬
		importOrder('java', 'javax', 'org', 'com.wiseai', '')
		removeUnusedImports()  // 사용하지 않는 import 자동 제거

		// 기타 포맷팅 규칙
		trimTrailingWhitespace()  // 줄 끝 공백 자동 제거
		endWithNewline()          // 파일 끝 개행 문자로 통일

		// 생성 파일 및 빌드 산출물 제외
		targetExclude(
			'**/Q*.java',              // QueryDSL 생성 파일
			'**/generated/**',         // 생성된 소스 파일
			'build/**',                // 빌드 산출물
			'.gradle/**'               // Gradle 캐시
		)
	}

	// Spotless 태스크 의존성 설정
	tasks.named('spotlessJava') {
		mustRunAfter 'compileJava'
	}

	// XML 파일 포맷팅 - 들여쓰기 및 구조 정리
	format 'xml', {
		target '*.xml'
		targetExclude(
			'build/**',                // 빌드 산출물
			'.gradle/**',              // Gradle 캐시
			'**/generated/**'          // 생성된 파일
		)
		trimTrailingWhitespace()
		indentWithTabs()
		endWithNewline()
	}

	// YAML 파일 포맷팅 - 들여쓰기 및 구조 정리
	format 'yaml', {
		target '*.yml', '*.yaml'
		targetExclude(
			'docker-compose.yml',      // Docker Compose는 스페이스 2칸 사용
			'docker-compose.aws.yml',
			'build/**',                // 빌드 산출물
			'.gradle/**'               // Gradle 캐시
		)
		trimTrailingWhitespace()
		indentWithSpaces(2)  // YAML 표준: 스페이스 2칸
		endWithNewline()
	}

	// Gradle 파일 포맷팅 - 들여쓰기 및 설정 정리
	format 'gradle', {
		target '*.gradle', '*.gradle.kts'
		targetExclude(
			'build/**',                // 빌드 산출물
			'.gradle/**'               // Gradle 캐시
		)
		trimTrailingWhitespace()
		indentWithTabs()
		endWithNewline()
	}

	// Markdown 파일 포맷팅 - 공백 및 줄바꿈 정리
	format 'markdown', {
		target '*.md'
		targetExclude(
			'build/**',                // 빌드 산출물
			'.gradle/**'               // Gradle 캐시
		)
		trimTrailingWhitespace()
		endWithNewline()
	}

	// 기타 파일 포맷팅
	format 'misc', {
		target '*.properties', '*.json', '*.sql'
		targetExclude(
			'build/**',                // 빌드 산출물
			'.gradle/**',              // Gradle 캐시
			'gradle-wrapper.jar',      // 바이너리 파일
			'**/node_modules/**'       // Node 모듈 (만약 있다면)
		)
		trimTrailingWhitespace()
		indentWithTabs()
		endWithNewline()
	}
}

// ===== JaCoCo 설정 =====
jacoco {
	toolVersion = "0.8.8"
}

// ===== JaCoCo 설정 (실무적 적용) =====
jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
		csv.required = false
	}

	// 실무적 설정: 특정 패키지만 커버리지 측정
	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: [
					'**/config/**',
					'**/dto/**',
					'**/vo/**',
					'**/entity/**',
					'**/enums/**',
					'**/exception/**'
					// 초기 단계에서는 AssignmentApplication 포함 (도메인 구현 후 제외 가능)
			])
		}))
	}

	// CI 워크플로우에서 명시적으로 jacocoTestCoverageVerification 실행
	// finalizedBy jacocoTestCoverageVerification
}

jacocoTestCoverageVerification {
	dependsOn jacocoTestReport

	violationRules {
		// TODO: 나중에 테스트 추가 후 0.50 (50%)로 변경 예정
		// 현재는 초기 스켈레톤 단계이므로 임시로 0%로 설정 (모든 커버리지 통과)
		rule {
			limit {
				minimum = 0.00 // 임시: 0% (나중에 50%로 변경 예정)
			}
		}
	}
}

// SonarQube를 필수 단계로 강제: 분석 전에 테스트/커버리지 생성
tasks.named('sonarqube') {
	dependsOn 'test', 'jacocoTestReport'
	// SONAR_TOKEN이 있을 때만 실행 (로컬/CI 모두)
	// 로컬: docker-compose up으로 SonarQube 실행 후 토큰 설정 필요
	//   예: export SONAR_TOKEN=$(curl -u admin:admin -X POST "http://localhost:9000/api/user_tokens/generate?name=local-token&type=PROJECT_ANALYSIS_TOKEN" | jq -r '.token')
	// CI: GitHub Actions에서 자동으로 토큰 생성
	onlyIf {
		def token = System.getenv('SONAR_TOKEN')
		return token != null && !token.isEmpty()
	}
}
