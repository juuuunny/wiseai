plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.11'
	id 'io.spring.dependency-management' version '1.1.7'

	// ===== 코드 품질 도구 설정 =====
	// 일상 개발용 (항상 활성화)
	id 'checkstyle'                    // 코드 스타일 검사
	id 'com.diffplug.spotless' version '6.23.3'  // 자동 포맷팅

	// 품질 분석용 (필요시 활성화)
	id 'jacoco'
	id 'org.sonarqube' version '4.2.1.3168'
}

group = 'com.wiseai'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}
configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}



tasks.withType(JavaCompile) {
	options.compilerArgs += ['-parameters']
}

configurations.all {
	exclude group: 'commons-logging', module: 'commons-logging'
}

jar {
	enabled = false
}

repositories {
	mavenCentral()
}

ext {
	mysqlConnectorVersion = '8.0.33'
	swaggerVersion = '2.6.0'
	lombokVersion = '1.18.30'
}

dependencies {
	// Spring Core
	implementation "org.springframework.boot:spring-boot-starter-web"
	implementation "org.springframework.boot:spring-boot-starter-validation"
	implementation "org.springframework.boot:spring-boot-starter-actuator"
	implementation "org.springframework.boot:spring-boot-starter-data-jpa"

	// MySQL
	implementation "com.mysql:mysql-connector-j:${mysqlConnectorVersion}"

	// Swagger
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${swaggerVersion}"

	// Lombok
	compileOnly "org.projectlombok:lombok:${lombokVersion}"
	annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
	testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
	testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"

	testImplementation "org.springframework.boot:spring-boot-starter-test"
	testImplementation 'com.h2database:h2'

	// 테스트 프레임워크 명시적 선언 (Gradle 9.0 호환성)
	testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// QueryDSL 등 생성 소스 관련 잔존 설정 제거

tasks.named('test') {
	useJUnitPlatform()
	// finalizedBy jacocoTestReport  // JaCoCo 활성화 시 주석 해제

	// CI 환경에서는 통합 테스트 제외 (외부 서버 의존성)
	def isCI = System.getenv("CI") == "true"
	if (isCI) {
		println "[CI MODE] Excluding integration tests: **/integration/**"
		exclude '**/integration/**'
		exclude '**/*IntegrationTest.class'
		exclude '**/*IntegrationTest*.class'
	} else {
		println "[LOCAL MODE] Running all tests including integration tests"
	}

	// 테스트 실행 전 로그
	doFirst {
		println "========================================="
		println "Running tests with CI=${isCI}"
		println "========================================="
	}
}

// ===== SonarQube 설정 =====
sonarqube {
	properties {
		property "sonar.projectKey", "juuuunny_wiseai"
		property "sonar.projectName", "wiseai"
		
		def sonarHostUrl = System.getenv("SONAR_HOST_URL") ?: "http://localhost:9000"
		property "sonar.host.url", sonarHostUrl
		property "sonar.token", System.getenv("SONAR_TOKEN") ?: ""
		
		// SonarQube Cloud를 사용하는 경우 organization 필수
		def sonarOrganization = System.getenv("SONAR_ORGANIZATION")
		if (sonarOrganization) {
			property "sonar.organization", sonarOrganization
		}
		
		property "sonar.sources", "src/main/java"
		property "sonar.tests", "src/test/java"
		property "sonar.java.binaries", "build/classes/java/main"
		property "sonar.java.test.binaries", "build/classes/java/test"
		property "sonar.java.coveragePlugin", "jacoco"
		property "sonar.coverage.jacoco.xmlReportPaths", "build/reports/jacoco/test/jacocoTestReport.xml"
		property "sonar.sourceEncoding", "UTF-8"
		property "sonar.java.source", "17"
		property "sonar.java.target", "17"
		// 리소스 파일에서 하드코딩된 자격증명 검사 제외 (환경 변수 사용)
		property "sonar.issue.ignore.multicriteria", "e1"
		property "sonar.issue.ignore.multicriteria.e1.ruleKey", "java:S6437"
		property "sonar.issue.ignore.multicriteria.e1.resourceKey", "**/application*.yaml"
	}
}

// ===== Checkstyle 설정 (항상 활성화) =====
checkstyle {
	toolVersion = '10.12.4'
	configFile = file('checkstyle.xml')
	ignoreFailures = false
	maxWarnings = 100
}

