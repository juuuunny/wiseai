version: "3.9"

services:
app:
	image: ${IMAGE_NAME}:${IMAGE_TAG}
	container_name: assignment-app
	environment:
	SPRING_PROFILES_ACTIVE: prod
	DB_URL: ${DB_URL}
	DB_USERNAME: ${DB_USERNAME}
	DB_PASSWORD: ${DB_PASSWORD}
	SERVER_PORT: ${SERVER_PORT:-8080}
	ports:
	- "${SERVER_PORT:-8080}:8080"
	restart: always
