spring:
  application:
    name: assignment

  profiles:
    active: default

  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
    access-token-expiration-time: ${JWT_ACCESS_EXPIRATION:900000} # 15 minutes
    refresh-token-expiration-time: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /docs
    display-request-duration: true
  api-docs:
    enabled: true

logging:
  level:
    root: INFO
    org.springframework: INFO

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${DB_URL:jdbc:mysql://db:3306/assignment?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:assignment}
    password: ${DB_PASSWORD:assignment}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

springdoc:
  swagger-ui:
    path: /docs
