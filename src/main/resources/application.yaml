spring:
  application:
    name: assignment

  profiles:
    active: default

  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
    access-token-expiration-time: ${JWT_ACCESS_EXPIRATION:900000} # 15 minutes
    refresh-token-expiration-time: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: assignment-payment-consumer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    template:
      default-topic: payment.process
    admin:
      fail-fast: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /docs
    display-request-duration: true
  api-docs:
    enabled: true

logging:
  level:
    root: INFO
    org.springframework: INFO

payment:
  kafka:
    topics:
      process: payment.process
      process-dlq: payment.process.dlq
      cancel: payment.cancel
      cancel-dlq: payment.cancel.dlq

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${DB_URL:jdbc:mysql://db:3306/assignment?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:assignment}
    password: ${DB_PASSWORD:assignment}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    admin:
      fail-fast: false

springdoc:
  swagger-ui:
    path: /docs
