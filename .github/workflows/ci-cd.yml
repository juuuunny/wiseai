name: CI-CD

on:
  push:
    branches:
      - main # 프로덕션 배포
      - develop # 개발 통합 (빌드/테스트만)
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build-test-analyze:
    runs-on: ubuntu-latest
    services:
      sonarqube:
        image: sonarqube:9.9-community
        ports:
          - 9000:9000
        env:
          SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: true
          SONAR_JDBC_URL: jdbc:h2:tcp://localhost:9092/sonar
          SONAR_JDBC_USERNAME: sonar
          SONAR_JDBC_PASSWORD: sonar
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:9000/api/system/status || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 60s
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Wait for SonarQube
        run: |
          echo "Waiting for SonarQube to be ready..."
          for i in {1..60}; do
            STATUS=$(curl -s http://localhost:9000/api/system/status 2>/dev/null || echo "")
            if echo "$STATUS" | grep -q '"status":"UP"'; then
              echo "SonarQube is ready!"
              break
            fi
            echo "Waiting... ($i/60) - Status: $STATUS"
            sleep 5
          done
          # SonarQube가 완전히 시작될 때까지 추가 대기
          sleep 15

      - name: Setup SonarQube admin password and get token
        id: sonar-token
        run: |
          # SonarQube 10.x는 처음 시작 시 랜덤 비밀번호 생성
          # 로그에서 비밀번호를 확인하거나, API를 통해 변경
          # 일단 기본 admin/admin 시도, 실패 시 로그 확인
          echo "Attempting to generate token..."
          
          # 먼저 기본 admin/admin으로 시도
          TOKEN=$(curl -u admin:admin -X POST "http://localhost:9000/api/user_tokens/generate?name=ci-token-$(date +%s)&type=PROJECT_ANALYSIS_TOKEN" 2>/dev/null | jq -r '.token // empty')
          
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Default password failed, SonarQube analysis will be skipped"
            echo "SONAR_TOKEN=" >> $GITHUB_ENV
          else
            echo "Token generated successfully"
            echo "SONAR_TOKEN=$TOKEN" >> $GITHUB_ENV
          fi
          echo "SONAR_HOST_URL=http://localhost:9000" >> $GITHUB_ENV

      - name: Checkstyle (코드 스타일 검사)
        run: ./gradlew checkstyleMain checkstyleTest

      - name: Spotless (코드 포맷 검사)
        run: ./gradlew spotlessCheck

      - name: Build (컴파일 + 테스트)
        run: ./gradlew clean build -x checkstyleMain -x checkstyleTest -x spotlessCheck --stacktrace

      - name: JaCoCo 리포트 생성
        run: ./gradlew jacocoTestReport

      - name: SonarQube 분석
        run: ./gradlew sonarqube

      - name: Upload Jacoco HTML report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html

  docker-publish:
    needs: build-test-analyze
    if: github.ref == 'refs/heads/main' # main 브랜치에서만 실행
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.DOCKER_IMAGE_NAME }}:latest

  deploy-ec2:
    needs: docker-publish
    if: github.ref == 'refs/heads/main' # main 브랜치에서만 실행
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd ~/app || mkdir -p ~/app && cd ~/app
            echo "IMAGE_NAME=${{ secrets.DOCKER_IMAGE_NAME }}" > .env
            echo "IMAGE_TAG=${{ github.sha }}" >> .env
            echo "SERVER_PORT=${{ secrets.SERVER_PORT }}" >> .env
            echo "DB_URL=${{ secrets.DB_URL }}" >> .env
            echo "DB_USERNAME=${{ secrets.DB_USERNAME }}" >> .env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
            docker pull ${{ secrets.DOCKER_IMAGE_NAME }}:${{ github.sha }}
            printf "%s\n" "$(cat <<'COMPOSE'
            version: "3.9"
            services:
              app:
                image: ${IMAGE_NAME}:${IMAGE_TAG}
                container_name: assignment-app
                environment:
                  SPRING_PROFILES_ACTIVE: prod
                  DB_URL: ${DB_URL}
                  DB_USERNAME: ${DB_USERNAME}
                  DB_PASSWORD: ${DB_PASSWORD}
                  SERVER_PORT: ${SERVER_PORT}
                ports:
                  - "${SERVER_PORT}:8080"
                restart: always
            COMPOSE
            )" > docker-compose.aws.yml
            docker compose -f docker-compose.aws.yml up -d
