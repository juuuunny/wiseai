name: CI-CD

on:
  push:
    branches:
      - main # 프로덕션 배포
      - develop # 개발 통합 (빌드/테스트만)
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  auto-format:
    name: 자동 포맷팅 적용
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Spotless 자동 포맷팅 적용
        run: |
          echo "========================================="
          echo "Spotless 자동 포맷팅 적용"
          echo "========================================="
          ./gradlew spotlessApply

      - name: 변경사항 확인 및 커밋
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "style: Spotless 자동 포맷팅 적용"
            git push
            echo "✅ 코드 포맷팅이 자동으로 적용되었습니다."
          else
            echo "ℹ️ 포맷팅 변경사항이 없습니다."
          fi

  build-test-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup CI Environment
        run: |
          echo "CI=true" >> $GITHUB_ENV
          echo "CI environment variable set"

      - name: Setup SonarQube (선택사항)
        run: |
          if [ -n "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "SONAR_HOST_URL=${{ secrets.SONAR_HOST_URL }}" >> $GITHUB_ENV
            echo "SONAR_TOKEN=${{ secrets.SONAR_TOKEN }}" >> $GITHUB_ENV
            # SonarQube Cloud를 사용하는 경우 organization 설정
            if [ -n "${{ secrets.SONAR_ORGANIZATION }}" ]; then
              echo "SONAR_ORGANIZATION=${{ secrets.SONAR_ORGANIZATION }}" >> $GITHUB_ENV
              echo "SonarQube Cloud organization configured"
            fi
            echo "SonarQube secrets configured"
          else
            echo "SONAR_TOKEN not set, SonarQube analysis will be skipped"
          fi
        continue-on-error: true

      - name: Checkstyle (코드 스타일 검사)
        run: |
          echo "========================================="
          echo "Step: Checkstyle (코드 스타일 검사)"
          echo "========================================="
          ./gradlew checkstyleMain checkstyleTest --stacktrace
          echo "✅ Checkstyle completed successfully"

      - name: Spotless (코드 포맷 검사)
        run: |
          echo "========================================="
          echo "Step: Spotless (코드 포맷 검사)"
          echo "========================================="
          ./gradlew spotlessCheck --stacktrace
          echo "✅ Spotless completed successfully"

      - name: Build (컴파일 + 테스트)
        run: |
          echo "========================================="
          echo "Step: Build (컴파일 + 테스트)"
          echo "========================================="
          ./gradlew clean build -x checkstyleMain -x checkstyleTest -x spotlessCheck --stacktrace
          echo "✅ Build completed successfully"

      - name: JaCoCo 리포트 생성
        run: |
          echo "========================================="
          echo "Step: JaCoCo 리포트 생성"
          echo "========================================="
          ./gradlew jacocoTestReport --stacktrace
          echo "✅ JaCoCo report generated successfully"

      - name: JaCoCo 커버리지 검증
        run: |
          echo "========================================="
          echo "Step: JaCoCo 커버리지 검증"
          echo "========================================="
          echo "현재 최소 커버리지 기준: 0% (임시)"
          echo "목표 커버리지 기준: 50% (나중에 활성화 예정)"
          ./gradlew jacocoTestCoverageVerification --stacktrace
          echo "✅ JaCoCo coverage verification passed"

      # SonarQube 분석 비활성화 (Quality Gate 설정 완료 후 활성화 예정)
      # 활성화하려면 아래 주석을 해제하고 `if: false`를 `if: env.SONAR_TOKEN != ''`로 변경
      # - name: SonarQube 분석 (선택사항)
      #   if: false  # 일단 비활성화
      #   run: |
      #     echo "========================================="
      #     echo "Step: SonarQube 분석"
      #     echo "========================================="
      #     echo "SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}"
      #     echo "SONAR_ORGANIZATION: ${{ env.SONAR_ORGANIZATION }}"
      #     ./gradlew sonarqube --stacktrace || {
      #       echo "⚠️ SonarQube analysis failed, but continuing..."
      #       exit 0
      #     }
      #     echo "✅ SonarQube analysis completed successfully"
      #   continue-on-error: true

      - name: Upload Jacoco HTML report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html

  docker-publish:
    needs: build-test-analyze
    if: github.ref == 'refs/heads/main' # main 브랜치에서만 실행
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build jar artifact
        run: ./gradlew clean bootJar

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.DOCKER_IMAGE_NAME }}:latest

  deploy-ec2:
    needs: docker-publish
    if: github.ref == 'refs/heads/main' # main 브랜치에서만 실행
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd ~/app || mkdir -p ~/app && cd ~/app
            echo "IMAGE_NAME=${{ secrets.DOCKER_IMAGE_NAME }}" > .env
            echo "IMAGE_TAG=${{ github.sha }}" >> .env
            echo "SERVER_PORT=${{ secrets.SERVER_PORT }}" >> .env
            echo "DB_URL=${{ secrets.DB_URL }}" >> .env
            echo "DB_USERNAME=${{ secrets.DB_USERNAME }}" >> .env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
            docker pull ${{ secrets.DOCKER_IMAGE_NAME }}:${{ github.sha }}
            printf "%s\n" "$(cat <<'COMPOSE'
            version: "3.9"
            services:
              app:
                image: ${IMAGE_NAME}:${IMAGE_TAG}
                container_name: assignment-app
                environment:
                  SPRING_PROFILES_ACTIVE: prod
                  DB_URL: ${DB_URL}
                  DB_USERNAME: ${DB_USERNAME}
                  DB_PASSWORD: ${DB_PASSWORD}
                  SERVER_PORT: ${SERVER_PORT}
                ports:
                  - "${SERVER_PORT}:8080"
                restart: always
            COMPOSE
            )" > docker-compose.aws.yml
            docker compose -f docker-compose.aws.yml up -d
