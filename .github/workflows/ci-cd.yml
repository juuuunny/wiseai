name: CI-CD

on:
  push:
    branches:
      - main # 프로덕션 배포
      - develop # 개발 통합 (빌드/테스트만)
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build-test-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup SonarQube (선택사항)
        run: |
          if [ -n "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "SONAR_HOST_URL=${{ secrets.SONAR_HOST_URL }}" >> $GITHUB_ENV
            echo "SONAR_TOKEN=${{ secrets.SONAR_TOKEN }}" >> $GITHUB_ENV
            echo "SonarQube secrets configured"
          else
            echo "SONAR_TOKEN not set, SonarQube analysis will be skipped"
          fi
        continue-on-error: true

      - name: Checkstyle (코드 스타일 검사)
        run: ./gradlew checkstyleMain checkstyleTest

      - name: Spotless (코드 포맷 검사)
        run: ./gradlew spotlessCheck

      - name: Build (컴파일 + 테스트)
        run: ./gradlew clean build -x checkstyleMain -x checkstyleTest -x spotlessCheck --stacktrace

      - name: JaCoCo 리포트 생성
        run: ./gradlew jacocoTestReport

      - name: SonarQube 분석 (선택사항)
        if: env.SONAR_TOKEN != ''
        run: ./gradlew sonarqube
        continue-on-error: true

      - name: Upload Jacoco HTML report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html

  docker-publish:
    needs: build-test-analyze
    if: github.ref == 'refs/heads/main' # main 브랜치에서만 실행
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.DOCKER_IMAGE_NAME }}:latest

  deploy-ec2:
    needs: docker-publish
    if: github.ref == 'refs/heads/main' # main 브랜치에서만 실행
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd ~/app || mkdir -p ~/app && cd ~/app
            echo "IMAGE_NAME=${{ secrets.DOCKER_IMAGE_NAME }}" > .env
            echo "IMAGE_TAG=${{ github.sha }}" >> .env
            echo "SERVER_PORT=${{ secrets.SERVER_PORT }}" >> .env
            echo "DB_URL=${{ secrets.DB_URL }}" >> .env
            echo "DB_USERNAME=${{ secrets.DB_USERNAME }}" >> .env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
            docker pull ${{ secrets.DOCKER_IMAGE_NAME }}:${{ github.sha }}
            printf "%s\n" "$(cat <<'COMPOSE'
            version: "3.9"
            services:
              app:
                image: ${IMAGE_NAME}:${IMAGE_TAG}
                container_name: assignment-app
                environment:
                  SPRING_PROFILES_ACTIVE: prod
                  DB_URL: ${DB_URL}
                  DB_USERNAME: ${DB_USERNAME}
                  DB_PASSWORD: ${DB_PASSWORD}
                  SERVER_PORT: ${SERVER_PORT}
                ports:
                  - "${SERVER_PORT}:8080"
                restart: always
            COMPOSE
            )" > docker-compose.aws.yml
            docker compose -f docker-compose.aws.yml up -d
